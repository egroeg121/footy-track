# Fast checks that run on every commit. See docs/development.md
# ("Checks before you commit").
#
#   Install the hooks:        make hooks     (runs `uvx pre-commit install`)
#   Run on every file once:   uvx pre-commit run --all-files
#
# Keep this light: no tests here, those run in CI and via `make check`.
# To add once the docs branch merges: a local hook that runs
# `python scripts/check_docs_diagrams.py` on changed docs.

# Avoid generated and binary content.
exclude: '^(data/|metaflow/|runs/|export/|notebooks/data/|\.dvc/|\.playwright-mcp/|.*\.pt$|uv\.lock$)'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: ["--unsafe"] # mkdocs.yml uses custom tags
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-toml

  # Keep this rev equal to the ruff version in uv.lock (currently 0.13.2).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.2
    hooks:
      - id: ruff-check
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # Spell checking (skip large/generated folders)
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        args:
          [
            "--skip",
            "data,metaflow,runs,export,*.pt,*.lock",
            "--ignore-words-list",
            "crate,fo,nd,mot,strack,implementors",
            "--quiet-level",
            "2",
          ]

  # Strip outputs from notebooks to keep diffs small
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout
        files: \.ipynb$
        exclude: ^(data/|runs/|export/)
