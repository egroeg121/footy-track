<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Footy Track</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2129; --ink:#e6edf3; --muted:#9bb0c0;
          --accent:#1e90ff; --green:#3fb950; --border:#2d3742; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         display:flex; flex-direction:column; align-items:center;
         justify-content:center; min-height:100vh; gap:0; }
  h1 { font-size:28px; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 40px; }
  .cards { display:flex; gap:20px; }
  .card { display:flex; flex-direction:column; align-items:center; gap:10px;
          background:var(--panel); border:1px solid var(--border); border-radius:12px;
          padding:32px 40px; text-decoration:none; color:var(--ink);
          transition:border-color .15s; min-width:180px; }
  .card:hover { border-color:var(--accent); }
  .card .icon { font-size:36px; }
  .card .label { font-size:15px; font-weight:600; }
  .card .desc { font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
  <h1>⚽ Footy Track</h1>
  <p>Annotation tools</p>
  <div class="cards">
    <a class="card" href="/labeller">
      <div class="icon">🏷️</div>
      <div class="label">Labeller</div>
      <div class="desc">Mark balls, players &amp; events frame by frame</div>
    </a>
    <a class="card" href="/object_review">
      <div class="icon">🃏</div>
      <div class="label">Object Review</div>
      <div class="desc">Correct object labels across all clips</div>
    </a>
  </div>
</body>
</html>
