<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Broadcast review</title>
<style>
  :root { --bg:#0f1419; --panel:#1a2129; --ink:#e6edf3; --muted:#9bb0c0; --green:#3fb950; --red:#f85149; --amber:#d29922; --border:#2d3742; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:8px; }
  header { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; font-size:13px; color:var(--muted); }
  header a { color:var(--muted); text-decoration:none; }
  h1 { font-size:16px; margin:0; color:var(--ink); }
  .bar { height:4px; background:var(--border); border-radius:2px; margin:6px 0; }
  .bar i { display:block; height:100%; background:var(--green); border-radius:2px; }
  img { width:100%; max-height:62vh; object-fit:contain; background:#000; border-radius:6px; display:block; }
  .q { text-align:center; margin:6px 0; color:var(--muted); font-size:13px; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  button { font:inherit; font-size:18px; padding:16px 8px; border-radius:8px; border:1px solid var(--border); background:var(--panel); color:var(--ink); cursor:pointer; }
  button.yes { border-color:var(--green); } button.no { border-color:var(--red); }
  button.small { font-size:13px; padding:8px; }
  .row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px; }
  .info { margin:6px 0; font-size:13px; color:var(--muted); text-align:center; min-height:20px; }
  .done { text-align:center; padding:40px 0; font-size:18px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--muted); font-weight:normal; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  td a { color:var(--ink); }
  .note { color:var(--muted); font-size:12px; margin:8px 0; }
</style>
</head>
<body>
<main>
  <header><a href="/">&larr; Home</a><h1 id="title">Broadcast review</h1><a id="sumlink" href="#">per-match summary</a><span id="count"></span></header>
  <div class="bar"><i id="fill" style="width:0"></i></div>
  <div id="view"></div>
</main>
<script>
const qs = new URLSearchParams(location.search);
const DS = qs.get("dataset") || "", JOB = qs.get("job");
const dsq = DS ? `dataset=${encodeURIComponent(DS)}` : "";
const api = (p, o) => fetch(p + (p.includes("?") ? "&" : "?") + dsq, o);
let job = null, i = 0, busy = false;
const skipped = new Set();               // frames the user stepped past without answering (this session)
const fkey = f => `${f.clip}\t${f.frame}`;

async function fetchJob() {
  const r = await api(`/broadcast_review/api/job/${encodeURIComponent(JOB)}`);
  return await r.json();
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = x => x == null ? "-" : (100 * x).toFixed(0) + "%";
const jobUrl = id => `/broadcast_review?${dsq}${dsq ? "&" : ""}job=${encodeURIComponent(id)}`;
// No ?job=: worst-first table of the classifier's accuracy per match (random stratum only, Wilson 95% CI).
async function loadSummary() {
  document.getElementById("title").textContent = "Broadcast review: per match";
  const v = document.getElementById("view");
  const r = await api("/broadcast_review/api/summary");
  const d = await r.json();
  const rows = d.matches.map(m => {
    const rd = m.random, ci = rd.ci ? ` (${pct(rd.ci[0])}-${pct(rd.ci[1])})` : "";
    const name = m.job_id ? `<a href="${jobUrl(m.job_id)}">${esc(m.title)}</a>` : esc(m.title);
    return `<tr><td>${name}</td><td>${esc(m.split)}</td><td class="num">${m.labelled}/${m.total}</td>
      <td class="num">${pct(rd.acc)}${ci}</td><td class="num">${rd.n}</td>
      <td class="num">${m.edge.wrong}/${m.edge.n}</td></tr>`;
  }).join("");
  const pooled = d.pooled.map(p => {
    const rd = p.random, ci = rd.ci ? ` (${pct(rd.ci[0])}-${pct(rd.ci[1])})` : "";
    return `<tr><td><b>All ${esc(p.split)} (${p.matches} matches)</b></td><td>${esc(p.split)}</td><td class="num">${p.labelled}/${p.total}</td>
      <td class="num">${pct(rd.acc)}${ci}</td><td class="num">${rd.n}</td><td class="num">${p.edge.wrong}/${p.edge.n}</td></tr>`;
  }).join("");
  v.innerHTML = `<table><thead><tr><th>Match (worst first)</th><th>Split</th><th class="num">Labelled</th>
    <th class="num">Accuracy, random frames (95% CI)</th><th class="num">n random</th><th class="num">Edge wrong</th></tr></thead>
    <tbody>${rows}${pooled}</tbody></table>
    <div class="note">Accuracy uses only the random frames (the one unbiased sample of a match; class-balanced), against stored
    scores.npz p_yes, unsure excluded. Edge wrong = edge frames the classifier got wrong, reported separately (they are picked for
    being near the boundary, so not an accuracy). Wide interval = label more frames for that match.</div>`;
}
document.getElementById("sumlink").href = `/broadcast_review${dsq ? "?" + dsq : ""}`;
async function load() {
  if (!JOB) { await loadSummary(); return; }
  job = await fetchJob();
  if (job.error) { document.getElementById("view").textContent = job.error; return; }
  document.getElementById("title").textContent = job.title;
  i = Math.max(0, job.frames.findIndex(f => !f.done));
  render();
  setInterval(refresh, 10000);
}
// A labelling hook may reorder the remaining frames (job.rev changes) while we are on screen. Re-read
// the job, keep showing the frame the user is on (found by key, its index moves) and let the next
// frame come from the new order. Answers given since are never lost: the server's verdicts win.
async function refresh() {
  if (!job || busy || document.hidden) return;
  let fresh;
  try { fresh = await fetchJob(); } catch (e) { return; }
  if (fresh.error) return;
  const changed = fresh.rev !== job.rev || fresh.total !== job.total ||
    JSON.stringify(fresh.calibration && fresh.calibration.version) !== JSON.stringify(job.calibration && job.calibration.version);
  if (!changed) return;
  const here = job.frames[i], hereKey = here ? fkey(here) : null;
  const locallyDone = new Map(job.frames.filter(f => f.done).map(f => [fkey(f), f.verdict]));
  fresh.frames.forEach(f => { if (!f.done && locallyDone.has(fkey(f))) { f.done = true; f.verdict = locallyDone.get(fkey(f)); } });
  job = fresh;
  const at = hereKey === null ? -1 : job.frames.findIndex(f => fkey(f) === hereKey);
  i = at >= 0 ? at : Math.max(0, job.frames.findIndex(f => !f.done));
  render();
}
// Next frame to show after answering: the first unanswered one in the job's current order that the
// user has not skipped; if only skipped ones remain, start over on them.
function nextIndex() {
  let k = job.frames.findIndex(g => !g.done && !skipped.has(fkey(g)));
  if (k < 0) { skipped.clear(); k = job.frames.findIndex(g => !g.done); }
  return k;
}
function step(d) {
  if (d > 0 && job.frames[i] && !job.frames[i].done) skipped.add(fkey(job.frames[i]));
  i += d; render();
}
function stats() {
  const d = job.frames.filter(f => f.done).length;
  document.getElementById("count").textContent = `${d}/${job.total}`;
  document.getElementById("fill").style.width = (100 * d / Math.max(1, job.total)) + "%";
  return d;
}
function fmt(s) { s = Math.round(s || 0); return `${Math.floor(s/3600)}:${String(Math.floor(s%3600/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`; }
function render() {
  const d = stats(), v = document.getElementById("view");
  if (i >= job.frames.length || i < 0) i = job.frames.length - 1;
  const f = job.frames[i];
  if (!f) { v.innerHTML = '<div class="done">Empty job.</div>'; return; }
  const url = `/broadcast_review/frame/${encodeURIComponent(f.clip)}/${f.frame}.jpg?${dsq}`;
  const cal = job.calibration;
  const fp = p => p == null ? "?" : (p >= 0.01 ? p.toFixed(2) : p.toPrecision(2));
  const calTxt = cal && f.p_cal != null
    ? ` &rarr; calibrated <b>${fp(f.p_cal)}</b> (50/50 at p_yes ${fp(cal.boundary_p_yes)}, v${cal.version}, n=${cal.n})` : "";
  const model = `model: <b>${f.pred ?? "?"}</b> (p_yes ${fp(f.p_yes)}${calTxt}, ${f.reason ?? ""})`;
  const ans = f.verdict ? `you: <b>${f.verdict}</b> &middot; ${model}` : model;
  v.innerHTML = `
    <img src="${url}" alt="frame">
    <div class="q">Is this a main-camera broadcast view of play? &middot; #${i + 1} &middot; match time ${fmt(f.ts_s)}</div>
    <div class="info">${ans}</div>
    <div class="btns"><button class="yes" data-v="yes">Yes (Y)</button><button class="no" data-v="no">No (N)</button></div>
    <div class="row"><button class="small" id="prev">&larr; Back</button><button class="small" data-v="unsure">Unsure (U)</button><button class="small" id="next">Skip &rarr;</button></div>
    ${d >= job.total ? '<div class="done">All answered. Thanks!</div>' : ""}`;
  v.querySelectorAll("[data-v]").forEach(b => b.onclick = () => answer(b.dataset.v));
  document.getElementById("prev").onclick = () => step(-1);
  document.getElementById("next").onclick = () => step(1);
}
async function answer(verdict) {
  if (busy) return;
  const f = job.frames[i];
  busy = true;
  try { await save(f, verdict); } finally { busy = false; }
}
async function save(f, verdict) {
  const r = await api(`/broadcast_review/api/verdict/${encodeURIComponent(f.clip)}/${f.frame}`, {
    method: "PUT", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({verdict, p_yes: f.p_yes, pred: f.pred, reason: f.reason, ts_s: f.ts_s}),
  });
  if (!r.ok) { alert("save failed: " + r.status); return; }
  f.verdict = verdict; f.done = true; skipped.delete(fkey(f));
  const nxt = nextIndex();
  i = nxt >= 0 ? nxt : Math.min(i + 1, job.frames.length - 1);
  render();
}
document.addEventListener("keydown", e => {
  if (!job) return;
  const k = e.key.toLowerCase();
  if (k === "y") answer("yes"); else if (k === "n") answer("no"); else if (k === "u") answer("unsure");
  else if (e.key === "ArrowLeft") step(-1); else if (e.key === "ArrowRight") step(1);
});
load();
</script>
</body>
</html>
