[build-system]
build-backend = "uv_build"

requires = [
  "uv-build>=0.8.22,<0.9",
]

[project]
name = "footy-track"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "george barnett", email = "george.it.help@gmail.com" },
]
requires-python = ">=3.12,<3.13"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "clip @ git+https://github.com/ultralytics/CLIP.git",
  "lap>=0.5.12",
  "mkdocs>=1.5.3",
  "mkdocs-material>=9.4.6",
  "numpy>=1.26",
  "openai>=2.6.1",
  "opencv-python>=4.8",
  "piexif>=1.1.3",
  "rich>=14.2",
  "roboflow>=1.2.11",
  "timm>=1.0.22",
  "tqdm>=4.66",
  "transformers>=4.57",
  "ultralytics>=8.3",
]

scripts.footy-track = "footy_track:main"

[dependency-groups]
dev = [
  "fiftyone>=1.8.1",
  "ipython>=9.5",
  "jupyter>=1.1.1",
  "labelbox>=7.2",
  "metaflow>=2.18.9",
  "prek",
  "pylint>=3.3.8",
  "pyrefly>=0.34",
  "pytest>=8.3",
  "pytest-xdist>=3.5",
  "ruff>=0.13.2",
  "transformers>=4.57",
  "umap-learn>=0.5.9.post2",
  "wandb",
]
metaflow = [
  "kubernetes>=29",
  "metaflow>=2.12",
]

[tool.ruff]
exclude = [
  "data",
  "docs",
  "export",
  "metaflow",
  "notebooks",
  "runs",
  "yolo11n.pt",
]

# Enable common rule sets: E,F (pycodestyle/pyflakes), I (isort), B (flake8-bugbear),
# UP (pyupgrade), SIM (flake8-simplify), PL (pylint), C4 (flake8-comprehensions)
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PL",
  "SIM",
  "UP",
]
# Let the formatter handle line length instead of emitting E501
ignore = [
  "E501",

  # Ignore magic numbers in tests
  "PLR2004",
]

per-file-ignores."tests/*.py" = [ "PLR2004" ]

[tool.pytest.ini_options]
addopts = "-q -n 2"
markers = [
  "slow: tests that run models and may take longer",
]

# Ruff configuration for linting and formatting
