[build-system]
build-backend = "uv_build"

requires = [
  "uv-build>=0.8.22,<0.9",
]

[project]
name = "footy-track"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "george barnett", email = "george.it.help@gmail.com" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "mkdocs>=1.5.3",
  "mkdocs-material>=9.4.6",
  "piexif",
  "ultralytics",
]

scripts.footy-track-extract-frames = "footy_track.scripts.extract_frames:main"
scripts.footy-track-split-video = "footy_track.scripts.split_video:main"

[dependency-groups]
dev = [
  "ipython",
  "jupyter",
  "prek",
  "pytest",
  "ruff",
  "ty",
]
metaflow = [
  "kubernetes>=29",
  "metaflow>=2.12",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  "data",
  "docs",
  "export",
  "metaflow",
  "notebooks",
  "runs",
  "yolo11n.pt",
]

format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "lf"
# Enable common rule sets: E,F (pycodestyle/pyflakes), I (isort), B (flake8-bugbear),
# UP (pyupgrade), SIM (flake8-simplify), PL (pylint), C4 (flake8-comprehensions)
lint.select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PL",
  "SIM",
  "UP",
]
# Let the formatter handle line length instead of emitting E501
lint.ignore = [
  "E501",
]

lint.per-file-ignores."tests/**/*.py" = [
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of `assert` detected
]

[tool.pytest.ini_options]
addopts = "-q"
markers = [
  "slow: tests that run models and may take longer",
]

