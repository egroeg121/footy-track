[project]
name = "footy-track"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "george barnett", email = "george.it.help@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lap>=0.5.12",
    "mkdocs>=1.5.3",
    "mkdocs-material>=9.4.6",
    "numpy>=1.26",
    "opencv-python>=4.8",
    "tqdm>=4.66",
    "ultralytics>=8.2",
    "piexif>=1.1.3",
]


[project.scripts]
footy-track = "footy_track:main"

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fiftyone>=1.8.1",
    "ipython>=9.5.0",
    "jupyter>=1.1.1",
    "metaflow>=2.18.9",
    "pylint>=3.3.8",
    "pyrefly>=0.34.0",
    "ruff>=0.13.2",
    "umap-learn>=0.5.9.post2",
    "pytest>=8.3",
    "labelbox>=7.2.0",
    "transformers>=4.57.0",
]
metaflow = [
    "metaflow>=2.12",
    "kubernetes>=29.0.0",
]


[tool.pytest.ini_options]
addopts = "-q"
markers = [
    "slow: tests that run models and may take longer",
]
